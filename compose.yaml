name: headless

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wppass
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_CONFIG_EXTRA: |
    define( 'JWT_AUTH_SECRET_KEY', '${JWT_AUTH_SECRET_KEY}' );
    define( 'JWT_AUTH_CORS_ENABLE', true );

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment: *wp-env
    volumes:
      - wp_core:/var/www/html
      - ./docker/wordpress/plugins:/var/www/html/wp-content/plugins
      - ./docker/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins

  wpcli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    volumes_from:
      - wordpress
    volumes:
      - ./docker/wordpress/setup.sh:/setup.sh:ro
    environment:
      <<: *wp-env
      WP_URL: http://wp.localhost:8090
      MENU_SLUG: primary
      DEMO_IMPORT: import-posts

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "[ -d node_modules/next ] || npm ci; npm run dev -- -H 0.0.0.0"
    depends_on:
      - wordpress
    ports:
      - "3000:3000"
    env_file: .env.docker
    environment:
      WATCHPACK_POLLING: "true"
    extra_hosts:
      - "wp.localhost:host-gateway"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      secrets:
        - nextenv
      extra_hosts:
        - "wp.localhost:host-gateway"
    image: headless-blog:prod
    depends_on:
      - wordpress
    ports:
      - "3002:3000"
    extra_hosts:
      - "wp.localhost:host-gateway"

volumes:
  db_data:
  wp_core:
  frontend_node_modules:
  frontend_next:

secrets:
  nextenv:
    file: ./.env.docker